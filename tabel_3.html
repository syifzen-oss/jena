<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Tabel 3 HTML</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="2" bgcolor="pink">Bulan</th>
            <th colspan="2" bgcolor="cyan">Jumlah Penjual</th>
        </tr>

        <tr>
            <th bgcolor="red">Kucing</th>
            <th bgcolor="yellow">Kelinci</th>
        </tr>

        <tr>
            <td>Januari</td>
            <td>101</td>
            <td>151</td>
        </tr>

        <tr>
            <td>February</td>
            <td>189</td> 
            <td>235</td>
        </tr>

        <tr>
           <td>Maret</td>
           <td>238</td>
           <td>678</td>
        </tr>

        <tr>
            <td>April</td>
            <td>489</td>
            <td>876</td>
        </tr>

        <tr>
            <td>Mei</td>
            <td>697</td>
            <td>891</td>
        </tr>
    </table>
</body>
</html>
