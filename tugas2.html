<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Luas Perkebunan</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="1" bgcolor="pink">Jumlah Perkebunan</th>
            <th colspan="4" bgcolor="yellow">Luas Tanah</th>
        </tr>

        <tr>
            <td>Kopi</td>
            <td>21 Hektar</td>
            <td>36 Hektar</td>
            <td>45 Hektar</td>
            <td>54 Hektar</td>
        </tr>

        <tr>
            <td>Kelapa Sawit</td>
            <td>30 Hektar</td>
            <td>27 Hektar</td>
            <td>31 Hektar</td>
            <td>40 Hektar</td>
        </tr>

        <tr>
           <th colspan="1" bgcolor="red">Total Produk</th>
           <th colspan="2" bgcolor="gray">Besaran Panen Bulanan</th>
           <th colspan="2" bgcolor="blue">Besaran Panen Tahunan</th>
        </tr>

        <tr>
            <td colspan="1">Kelapa Sawit</td>
            <td colspan="2">200 Ton</td>
            <td colspan="2">450 Ton</td>
        </tr>
    </table>
</body>
</html>
